databases:
  - name: nexora-db
    databaseName: nexora
    user: nexora
    plan: free

services:
  # FastAPI Backend API Service
  - type: web
    name: nexora-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 8000
      # Placeholders for keys to be set in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false

  # Next.js Frontend Web Service
  - type: web
    name: nexora-web
    runtime: docker
    dockerContext: apps/web
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nexora-api
          property: url
      - key: PORT
        value: 3000
